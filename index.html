<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Docker Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        .container {
            background: black;
            width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 20px;
        }

        .success {
            color: pink;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Jenkins + Docker CI/CD</h1>

        <p class="success">Application is running successfully!</p>

        <p>This website is running inside a Docker container.</p>

        <p>Code is deployed through Jenkins from GitHub when changes made.</p>

    </div>

</body>
</html>
